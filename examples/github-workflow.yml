# Copy to .github/workflows/fendkit.yml and set your product build below.
# Guide: https://github.com/vincentsch/fendkit/blob/main/docs/github-action.md
name: Check product evidence
on:
  pull_request:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Run fendkit init locally and commit cra.yml before enabling this job.
      # Replace this build command with your product's release build.
      - name: Build product ZIP
        run: make release
      - uses: vincentsch/fendkit@v0.1.0
        with:
          version: v0.1.0
          release: dist/*.zip
  attach:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cra.yml must already be committed. Download the maker's published ZIP.
      - name: Download product release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release download "$RELEASE_TAG" --pattern '*.zip' --dir dist
      - uses: vincentsch/fendkit@v0.1.0
        with:
          version: v0.1.0
          release: dist/*.zip
          attach-to-release: 'true'
