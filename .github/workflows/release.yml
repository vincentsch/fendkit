name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release-notes.sh "$RELEASE_TAG" > release-notes.md
      - name: Build release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make build-all VERSION="$RELEASE_TAG"
      - name: Attest binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/fendkit-linux-*
            dist/fendkit-darwin-*
            dist/fendkit-windows-*.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md dist/fendkit-* dist/checksums.txt
