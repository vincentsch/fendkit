name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/release-notes.sh "$RELEASE_TAG" > release-notes.md
      - name: Build release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make build-all VERSION="$RELEASE_TAG"
      - name: Attest binaries
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: |
            dist/fendkit-linux-*
            dist/fendkit-darwin-*
            dist/fendkit-windows-*.exe
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md dist/fendkit-* dist/checksums.txt
